<style>

</style>

  const st=s.status||'ok'; const stLabel={ok:'검증됨',check:'당일 확인 필요',unknown:'미확정 · 메모 참고',leg:'교통'}[st];

  if(s.kind!=='leg')b+=`<dl class="kv">${p.address?`<dt>주소</dt><dd>${p.address}</dd>`:''}${p.hours?`<dt>영업시간</dt><dd>${p.hours}</dd>`:''}${p.category?`<dt>분류</dt><dd>${p.category}</dd>`:''}${p.lat?`<dt>좌표</dt><dd>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)} <a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener" style="color:var(--teal)">지도 열기</a></dd>`:''}</dl>`;
  if(p.alternatives&&p.alternatives.length)b+=`<div class="box"><h4>대체 후보</h4><ul style="margin:0;padding-left:18px">${p.alternatives.map(a=>`<li>${a}</li>`).join('')}</ul></div>`;
  if(p.sources&&p.sources.length)b+=`<div class="box"><h4>출처 · 확인 ${META.checked_at}</h4>${p.sources.slice(0,3).map(u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').slice(0,60)}</a>`).join('<br>')}<div style="font-size:11px;color:var(--muted)">확신도: ${p.confidence||'-'}</div></div>`;
  b+=`<div class="nav"><button data-done="${s.id}">${STATE.done[s.id]?'✓ 방문 완료 취소':'방문 완료'}</button></div>`;
  $('#dBody').innerHTML=b; $('#dBody').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>goRoute(s.id,x.dataset.go)); const cb=$('#dBody [data-cancel]'); if(cb) cb.onclick=cancelRoute; const dn=$('#dBody [data-done]'); if(dn)dn.onclick=()=>{STATE.done[s.id]=!STATE.done[s.id];save();$$('.pin').forEach(pn=>pn.classList.toggle('done',!!STATE.done[pn.dataset.id]));dn.textContent=STATE.done[s.id]?'✓ 방문 완료 취소':'방문 완료';};
  $('#sheet').classList.add('open'); }
function closeSheet(){$('#sheet').classList.remove('open');}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);}
$('#dClose').onclick=closeSheet; $('#dayTabs').innerHTML=Object.keys(DAYS).map(d=>`<button role="tab" data-day="${d}" aria-selected="${d==='1'}"><b>DAY ${d}</b>${DAYS[d].short||DAYS[d].label}</button>`).join(''); $$('#dayTabs button').forEach(b=>b.onclick=()=>setDay(+b.dataset.day));
(()=>{const sh=$('#sheet');let y0=null;sh.addEventListener('pointerdown',e=>{if(e.target.closest('.bd')&&$('#dBody').scrollTop>0)return;y0=e.clientY;});sh.addEventListener('pointermove',e=>{if(y0==null)return;const dy=e.clientY-y0;if(dy>0)sh.style.transform=`translateY(${dy}px)`;});const up=e=>{if(y0==null)return;const dy=e.clientY-y0;sh.style.transform='';if(dy>90)closeSheet();y0=null;};sh.addEventListener('pointerup',up);sh.addEventListener('pointercancel',up);})();
$$('.screen [data-close]').forEach(b=>b.onclick=()=>b.closest('.screen').classList.remove('open'));
$('#btnNotes').onclick=()=>{renderNotes();$('#scrNotes').classList.add('open');}; $('#btnSources').onclick=()=>{renderSources();$('#scrSources').classList.add('open');}; $('#btnSettings').onclick=()=>{renderSettings();$('#scrSettings').classList.add('open');};
function renderNotes(){const unk=NOTES.map(n=>`<div class="item"><div class="t">${n.t}</div><div class="s">${n.s}</div>${n.opts?`<ul>${n.opts.map(o=>`<li>${o}</li>`).join('')}</ul>`:''}${n.how?`<div class="s"><b>확인 방법:</b> ${n.how}</div>`:''}</div>`).join('');const chk=Object.values(PLACES).filter(p=>p.check_realtime&&p.check_realtime!=='-').map(p=>`<div class="item"><div class="t">${p.user_name}</div><div class="s">${p.check_realtime}</div></div>`).join('');$('#notesBody').innerHTML=`<div class="s" style="color:var(--muted)">지인에게 받은 일정이라 확정하지 못한 항목입니다. 지도에는 회색 물음표 핀으로 표시됩니다.</div>${unk}<h3>출발 전 실시간 확인 목록</h3>${chk}`;}
function renderSources(){$('#sourcesBody').innerHTML=`<div class="item"><div class="t">확인 시점 ${META.checked_at}</div><div class="s">${META.coordinate_note}</div><div class="s">3D 지도는 OpenStreetMap 기여자 데이터(ODbL)로 건물·도로·철도·수면·공원을 실제 위치와 크기로 세운 것입니다. 건물 높이는 OSM의 층수·높이 태그가 있으면 그 값을, 없으면 용도별 기본값을 씁니다.</div></div>`+Object.values(PLACES).map(p=>`<div class="item"><div class="t">${p.user_name} <span class="st ${p.target_status==='open'?'ok':'check'}">${p.confidence}</span></div><div class="s">${p.verified_name_ja||''}</div>${(p.sources||[]).map(u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).join('<br>')}</div>`).join('');}
function renderSettings(){$('#settingsBody').innerHTML=`<label class="f">Day 1 시작 시각 (텐진 도착·짐 보관)<input type="time" id="st1" value="${STATE.start[1]}"></label><label class="f">Day 2 시작 시각 (晴レ吉 체크아웃)<input type="time" id="st2" value="${STATE.start[2]}"></label><label class="f">Day 3 시작 시각 (M&M카페)<input type="time" id="st3" value="${STATE.start[3]}"></label><label class="tog"><span>거리 애니메이션 (사람·차량·열차)</span><input type="checkbox" id="amb" ${STATE.ambient?'checked':''}></label><div class="item"><div class="s">시작 시각을 바꾸면 전체 일정이 함께 밀립니다. 개점 시간이 정해진 곳(효탄스시 11:30, 포켓몬센터 10:00, 블루윙 16:00, 미츠바치 17:30)은 도착이 빠르면 "대기"로 표시됩니다.</div></div><div class="item"><div class="s">두 손가락으로 회전·확대, 한 손가락으로 이동. 저사양 기기·모션 최소화 설정에서는 사람과 차량 수가 줄거나 멈춥니다. (현재: ${W.reduced?'모션 최소화':W.lowperf?'저사양 모드':'일반'})</div></div>`;const re=()=>{renderCards();if(STATE.sel)select(STATE.sel,false);};$('#st1').onchange=e=>{STATE.start[1]=e.target.value||'11:00';save();re();};$('#st2').onchange=e=>{STATE.start[2]=e.target.value||'08:45';save();re();};$('#st3').onchange=e=>{STATE.start[3]=e.target.value||'10:00';save();re();};$('#amb').onchange=async e=>{STATE.ambient=e.target.checked;save();W.ambient=STATE.ambient&&!W.reduced;const sc=STATE.scene;STATE.scene=null;await showScene(sc);if(STATE.sel)select(STATE.sel,false);};}
$('#legend').innerHTML=['walk','subway','shinkansen','train'].map(k=>`<span><i style="border-color:${MODES[k].c};${MODES[k].dash?'border-style:dashed':''}"></i>${MODES[k].n}</span>`).join('');
setDay(1);
</script>
</body>
